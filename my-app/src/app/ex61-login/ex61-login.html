<div class="container mt-4">

  <!-- Cookie info banner: shown when a previous login cookie is found -->
  <div *ngIf="loggedUsername" class="alert alert-success" role="alert">
    Welcome back! Last logged in as: <strong>{{ loggedUsername }}</strong>
    <span *ngIf="loggedFullname"> &mdash; {{ loggedFullname }}</span>
  </div>

  <div class="card" style="width: 22rem;">
    <div class="card-header">Login System</div>
    <div class="card-body">
      <form (ngSubmit)="login()">
        <div class="mb-3">
          <label for="name-reg" class="form-label">User Name:</label>
          <input type="text" class="form-control" id="name-reg"
                 name="username" [(ngModel)]="username" required>
        </div>
        <div class="mb-3">
          <label for="password-reg" class="form-label">Password:</label>
          <input type="password" class="form-control" id="password-reg"
                 name="password" [(ngModel)]="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <!-- Result message -->
      <p *ngIf="message" class="mt-3 mb-0" [ngClass]="messageClass">{{ message }}</p>
    </div>
  </div>

</div>
